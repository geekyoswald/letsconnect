name: CI/CD Workflow

on:
  push:
    branches:
      - t3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build & push ARM64 image
      - name: Build Docker image for ARM64
        run: |
          docker buildx create --use --name mybuilder
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/arm64 \
            -t geekyoswald/letsconnect:latest \
            --push .

      # 5️⃣ Setup SSH
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 6️⃣ Deploy on EC2 (Docker Compose)
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@ec2-13-50-239-137.eu-north-1.compute.amazonaws.com << 'EOF'
            set -e

            cd /home/ubuntu/letsconnect

            # Pull latest image
            sudo docker compose pull

            # Restart app using compose (correct way)
            sudo docker compose down
            sudo docker compose up -d
          EOF
